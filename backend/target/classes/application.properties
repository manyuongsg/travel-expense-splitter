# =============================================
# Split and Share - Application Configuration
# =============================================

spring.application.name=split-and-share
server.port=8080

# ----- Database (H2 file-based for development — data survives restarts) -----
spring.datasource.url=jdbc:h2:file:./data/splitandshare-dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----- Uncomment below and comment out H2 section for PostgreSQL -----
# spring.datasource.url=jdbc:postgresql://localhost:5432/splitandshare
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=your_db_user
# spring.datasource.password=your_db_password

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For PostgreSQL use: org.hibernate.dialect.PostgreSQLDialect

# ----- JWT -----
# Generate a secure secret: openssl rand -base64 64
app.jwt.secret=REDACTED_JWT_SECRET
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# ----- Google OAuth -----
# Set your Web Client ID from Google Cloud Console
app.google.client-id=YOUR_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com

# ----- CORS (allow React Native dev) -----
app.cors.allowed-origins=http://localhost:19006,http://10.0.2.2:19006,http://localhost:3000
