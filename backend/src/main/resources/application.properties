# =============================================
# Split and Share - Application Configuration
# =============================================
# After cloning, update the values marked with TODO before running.

spring.application.name=split-and-share
server.port=8080

# ----- Database (H2 — data survives restarts) -----
spring.datasource.url=jdbc:h2:file:./data/splitandshare-dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----- Uncomment for PostgreSQL (production) -----
# spring.datasource.url=jdbc:postgresql://localhost:5432/splitandshare
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=your_db_user
# spring.datasource.password=your_db_password
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ----- JWT -----
# TODO: Replace with your own secret before running.
# Generate one with: openssl rand -base64 64
app.jwt.secret=REPLACE_WITH_YOUR_JWT_SECRET
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# ----- Google OAuth (optional) -----
# TODO: Add your Web Client ID from Google Cloud Console if using Google login.
app.google.client-id=YOUR_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com

# ----- CORS -----
app.cors.allowed-origins=http://localhost:19006,http://10.0.2.2:19006,http://localhost:3000
