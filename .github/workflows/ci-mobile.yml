name: Mobile CI
on:
  pull_request:
    paths: ['apps/mobile/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npx expo-doctor
        working-directory: apps/mobile